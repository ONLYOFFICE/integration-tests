version: '3'

services:
    liferay:
        image: ${LIFERAY_IMAGE}
        environment:
            LIFERAY_VIRTUAL_PERIOD_HOSTS_PERIOD_VALID_PERIOD_HOSTS: ${LIFERAY_HOST}
            LIFERAY_PASSWORDS_PERIOD_DEFAULT_PERIOD_POLICY_PERIOD_NAME: "Default Password Policy1"
            LIFERAY_PASSWORDS_PERIOD_DEFAULT_PERIOD_POLICY_PERIOD_CHANGE_PERIOD_REQUIRED: "false"
            LIFERAY_COMPANY_PERIOD_SECURITY_PERIOD_STRANGERS_PERIOD_VERIFY: "false"
            LIFERAY_USERS_PERIOD_REMINDER_PERIOD_QUERIES_PERIOD_ENABLED: "false"
            LIFERAY_USERS_PERIOD_REMINDER_PERIOD_QUERIES_PERIOD_CUSTOM_PERIOD_QUESTION_PERIOD_ENABLED: "false"
            LIFERAY_ENTERPRISE_PERIOD_PRODUCT_PERIOD_ENTERPRISE_PERIOD_SEARCH_PERIOD_ENABLED: "false"
            LIFERAY_SETUP_PERIOD_WIZARD_PERIOD_ENABLED: "false"
        ports:
            - "8080:8080"
        # No bind mounts for the plugin jar / license / plugin configuration: they are shipped into
        # the running container with `docker cp` instead — see shipToContainer in tests/setup/liferay.ts.
