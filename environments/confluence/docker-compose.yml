version: '3'

services:
    confluence:
        image: atlassian/confluence:${CONFLUENCE_VERSION:-10.2.14}
        environment:
            CATALINA_OPTS: "-Dupm.plugin.upload.enabled=true -Datlassian.upm.signature.check.disabled=true"
            # Close the DB and license screens in the setup wizard. The other screens (deployment
            # type, content, user management, admin account) Atlassian doesn't let you configure
            # via env at all — tests/setup/confluence.ts completes them with plain POST requests
            ATL_DB_TYPE: postgresql
            ATL_JDBC_URL: "jdbc:postgresql://postgres:5432/confluence"
            ATL_JDBC_USER: confluence
            ATL_JDBC_PASSWORD: confluence
            ATL_LICENSE_KEY: ${CONFLUENCE_LICENSE_KEY}
            # Makes Tomcat report this host/port for every request (regardless of the Host header
            # actually used to reach it), so Confluence auto-detects and stores this as its site
            # base URL during setup — the ONLYOFFICE plugin needs a base URL the Document Server
            # container can reach back over, not 127.0.0.1 (see tests/setup/confluence.ts)
            ATL_PROXY_NAME: ${CONFLUENCE_PROXY_NAME}
            ATL_PROXY_PORT: "8090"
            ATL_TOMCAT_SCHEME: http
            ATL_TOMCAT_SECURE: "false"
        ports:
          - '8090:8090'
          - '8091:8091'
        networks:
            - atlassian
        depends_on:
            postgres:
                condition: service_healthy

    postgres:
        image: postgres:13.9
        environment:
            POSTGRES_DB: confluence
            POSTGRES_USER: confluence
            POSTGRES_PASSWORD: confluence
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 5s
        networks:
            - atlassian

networks:
    atlassian:
        name: atlassian
